services:
  db:
    image: mysql:8.4
    container_name: iedlv-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-panel_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-panel_admin}
      BD_NOMBRE: bdiedlavictoria
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./database/script.sql:/docker-entrypoint-initdb.d/01_script.sql:ro
      - ./docker/mysql/02_inicializacion.sh:/docker-entrypoint-initdb.d/02_inicializacion.sh:ro
      - ./database/G3_complementos.sql:/seed/G3_complementos.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  datos_mysql:
